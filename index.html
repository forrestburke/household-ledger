function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field !== '' || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function parseAmount(raw){
  if(raw == null) return NaN;
  let s = String(raw).trim();
  if(!s) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/[^0-9.\-]/g, '');
  let n = parseFloat(s);
  if(isNaN(n)) return NaN;
  if(neg) n = -Math.abs(n);
  return n;
}

function parseDate(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{2,4})/);
  if(m){
    let [_, a, b, y] = m;
    if(y.length === 2) y = '20'+y;
    return y+'-'+a.padStart(2,'0')+'-'+b.padStart(2,'0');
  }
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return null;
}

    const label = (name, midAngle, frac) => {
      if(frac < 0.05) return '';
      const lx = cx + labelR * Math.cos(toRad(midAngle));
      const ly = cy + labelR * Math.sin(toRad(midAngle));
      return '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" dominant-baseline="middle" ' +

        'style="font-family:\'IBM Plex Sans\',sans-serif; pointer-events:none;">' + Math.round(frac*100) + '%</text>';
    };

      const x1 = cx + r * Math.cos(toRad(startAngle));

        ' L ' + ix1 + ' ' + iy1 + ' A ' + r0 + ' ' + r0 + ' 0 ' + large + ' 0 ' + ix2 + ' ' + iy2 + ' Z';
      const dim = selected.length && !selected.includes(s.name);
      paths += '<path class="pie-slice' + (dim ? ' pie-dim' : '') + '" data-solo-parent="' + esc(s.name) + '" d="' + d + '" fill="' + colorFn(s.name, i) + '">' +

        if(!childrenMap.has(key)) childrenMap.set(key, []);
        childrenMap.get(key).push(c);
        childIds.add(c.id);
      }
    });
    const groups = [];

    cats.forEach(c => {
      if(childIds.has(c.id)) return;

      if(seen.has(key)) return;

    for(const [key, kids] of childrenMap){
      if(byNameLower.has(key) || seen.has(key)) continue;

      groups.push({name: kids[0].parent.trim(), self: null, children: kids});

    expenseGroupsRaw.forEach(g => {
      if(g.self){
        const selfSpent = expenseSpent([catLabel(g.self, state.categories)]);
        breakdownSubs.push({name: catLabel(g.self, state.categories), value: selfSpent});
      }
      g.kids.forEach(k => {
        const kSpent = expenseSpent([catLabel(k, state.categories)]);
        breakdownSubs.push({name: catLabel(k, state.categories), value: kSpent});
      });
    });
    breakdownSubs.sort((a,b) => b.value - a.value);
    const breakdownTotal = breakdownParents.reduce((a,s) => a + s.value, 0);

    const parentLegend = breakdownParents.map((s, i) => {
      const pct = breakdownTotal > 0 ? (s.value / breakdownTotal * 100) : 0;
      const dim = state.txFilters.parents.length && !state.txFilters.parents.includes(s.name);
      return '<div class="legend-row legend-row-clickable' + (dim ? ' legend-dim' : '') + '" data-solo-parent="' + escapeHtml(s.name) + '">' +
        '<span class="legend-dot" style="background:' + colorForGroup(s.name) + '"></span>' +
        '<span class="legend-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="legend-pct num">' + pct.toFixed(1) + '%</span>' +
        '<span class="legend-amt num">' + fmtMoney(s.value) + '</span>' +
      '</div>';
    }).join('');
    const subLegend = breakdownSubs.map(s => {
      const pct = breakdownTotal > 0 ? (s.value / breakdownTotal * 100) : 0;
      return '<div class="legend-row legend-row-sub">' +
        '<span class="legend-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="legend-pct num">' + pct.toFixed(1) + '%</span>' +
        '<span class="legend-amt num">' + fmtMoney(s.value) + '</span>' +
      '</div>';
    }).join('');

    const soloedGroupsRaw = state.txFilters.parents.length
      ? expenseGroupsRaw.filter(g => state.txFilters.parents.includes(g.name))
      : expenseGroupsRaw;
    const soloChips = expenseGroupsRaw.map((g) => {
      const active = state.txFilters.parents.includes(g.name);
      const solid = colorForGroup(g.name);
      const faded = solid.replace(')', ' / .3)');
      const style = 'background:' + (active ? solid : faded) + '; border-color:' + solid + ';';
      return '<button type="button" class="solo-chip' + (active ? ' active' : '') + '" style="' + style + '" data-solo-parent="' + escapeHtml(g.name) + '">' + escapeHtml(g.name) + '</button>';
    }).join('') + (state.txFilters.parents.length ? '<button type="button" class="expand-btn" id="solo-clear">Clear filters</button>' : '');
    const catRows = soloedGroupsRaw.length ? sortGroups(soloedGroupsRaw).map(g => {
      const {kids, monthly, catSpent, ratio, allAutoDeducted} = g;
      const pct = Math.min(100, ratio * 100);
      const status = allAutoDeducted ? 'ok' : (ratio > 1 ? 'over' : (ratio >= CAUTION_AT ? 'caution' : 'ok'));
      const statusLabel = allAutoDeducted ? 'auto-deducted' : (status === 'over' ? 'over budget' : status === 'caution' ? 'watch spending' : 'on track');
      const remain = monthly - catSpent;
      const childRows = kids.map(k => {
        if(k.autoDeducted){
          return '<div class="cat-row cat-child">' +
            '<div class="name">' + escapeHtml(k.name) + ' <span class="pill" style="background:var(--line); color:var(--ink-soft);">auto-deducted</span></div>' +
            '<div class="figures"><span class="num">' + fmtMoney(k.monthly) + ' / paycheck</span></div>' +
          '</div>';
        }
        const kSpent = expenseSpent([catLabel(k, state.categories)]);
        const kRatio = k.monthly > 0 ? kSpent / k.monthly : (kSpent > 0 ? Infinity : 0);
        const kStatus = kRatio > 1 ? 'over' : (kRatio >= CAUTION_AT ? 'caution' : 'ok');
        return '<div class="cat-row cat-child">' +
          '<div class="name">' + escapeHtml(k.name) + '</div>' +
          '<div class="figures"><span class="spent num ' + kStatus + '">' + fmtMoney(kSpent) + '</span> / <span class="num">' + fmtMoney(k.monthly) + '</span></div>' +
        '</div>';
      }).join('');
      return '<div class="cat-group" data-group="' + escapeHtml(g.name) + '">' +
        '<div class="cat-row">' +
          '<div class="name">' + escapeHtml(g.name) + '</div>' +
          '<div class="figures"><span class="spent num ' + status + '">' + fmtMoney(catSpent) + '</span> / <span class="num">' + fmtMoney(monthly) + '</span> ' +
          '<span class="pill ' + status + '">' + statusLabel + '</span></div>' +
          '<div class="bar-track"><div class="bar-fill ' + status + '" style="width:' + pct + '%"></div></div>' +
          '<div class="figures" style="grid-column:1/-1; font-size:.74rem;">' + (remain >= 0 ? fmtMoney(remain) + ' left this month' : fmtMoney(Math.abs(remain)) + ' over this month') + '</div>' +
        '</div>' +
        childRows +
      '</div>';
    }).join('') : '<div class="empty">Upload your budget structure to see categories here.</div>';

    const INCOME_ORDER = ['Erin pay', 'David pay', 'Erin bonuses', 'Additional income'];
    const incomeGroups = groupCategories(incomeCats).sort((a,b) => {
      const ia = INCOME_ORDER.indexOf(a.name), ib = INCOME_ORDER.indexOf(b.name);
      if(ia !== -1 && ib !== -1) return ia - ib;
      if(ia !== -1) return -1;
      if(ib !== -1) return 1;
      return a.name.localeCompare(b.name);
    });
    const incomeRows = incomeGroups.length ? incomeGroups.map((g, i) => {
      const kids = g.children.slice().sort((a,b) => a.name.localeCompare(b.name));
      const labels = [...(g.self ? [catLabel(g.self, state.categories)] : []), ...kids.map(k => catLabel(k, state.categories))];
      const monthly = (g.self ? g.self.monthly : 0) + kids.reduce((a,k) => a + k.monthly, 0);
      const catActual = incomeActual(labels);
      const incomeColor = sliceColor(i, incomeGroups.length);
      const hasData = monthly > 0 || catActual > 0;
      const ahead = monthly === 0 ? catActual > 0 : catActual >= monthly;
      const childRows = kids.map(k => {
        const kActual = incomeActual([catLabel(k, state.categories)]);
        return '<div class="income-row cat-child">' +
          '<div class="name">' + escapeHtml(k.name) + '</div>' +
          '<div class="figures"><span class="num good">' + fmtMoney(kActual) + '</span> / <span class="num">' + fmtMoney(k.monthly) + ' planned</span></div>' +
        '</div>';
      }).join('');
      return '<div class="cat-group" data-group="' + escapeHtml(g.name) + '">' +
        '<div class="income-row">' +
          '<div class="name"><span class="legend-dot" style="background:' + incomeColor + '"></span>' + escapeHtml(g.name) +
            (hasData ? '<span class="pill ' + (ahead ? 'ok' : 'caution') + '">' + (ahead ? 'fully received' : 'partially received') + '</span>' : '') +
          '</div>' +
          '<div class="figures"><span class="num good">' + fmtMoney(catActual) + '</span> / <span class="num">' + fmtMoney(monthly) + ' planned</span></div>' +
        '</div>' +
        childRows +
      '</div>';
    }).join('') : '';

    const newCount = txs.filter(t => t.reviewed === false).length;
    const parentNamesInUse = new Set(state.categories.filter(c => (c.parent||'').trim()).map(c => c.parent.trim().toLowerCase()));
    const selectableCats = state.categories.filter(c => !parentNamesInUse.has(c.name.toLowerCase()));
    const catLabelOpts = selectableCats.map(c => catLabel(c, state.categories))
      .filter((v,i,a) => a.indexOf(v) === i)
      .sort((a,b) => a.localeCompare(b));
    const optsHtmlBase = ['Uncategorized', ...catLabelOpts];
    const accountsInUse = Array.from(new Set(txs.map(t => t.account).filter(Boolean))).sort((a,b) => a.localeCompare(b));
    const filtersActive = !!state.txFilters.search.trim() || state.txFilters.account !== 'all' || state.txFilters.category !== 'all' || state.txFilters.parents.length > 0;
    const searchTerm = state.txFilters.search.trim().toLowerCase();
    const filteredTxs = txs.filter(t => {
      if(state.txFilters.account !== 'all' && t.account !== state.txFilters.account) return false;
      if(state.txFilters.category !== 'all' && t.category !== state.txFilters.category) return false;
      if(state.txFilters.parents.length){
        const matched = state.categories.find(c => catLabel(c, state.categories) === t.category);
        if(!matched || !state.txFilters.parents.includes(categoryGroupName(matched))) return false;
      }
      if(searchTerm){
        const haystack = (t.desc.toLowerCase() + ' ' + Math.abs(t.amount).toFixed(2) + ' ' + fmtMoney(t.amount).toLowerCase());
        if(!haystack.includes(searchTerm)) return false;
      }
      return true;
    });
    const txRows = filteredTxs.slice().sort((a,b) => {
      const an = a.reviewed === false, bn = b.reviewed === false;
      if(an !== bn) return an ? -1 : 1;
      return b.date.localeCompare(a.date);
    }).map(t => {
      const opts = optsHtmlBase
        .map(name => '<option value="' + escapeHtml(name) + '"' + (name === t.category ? ' selected' : '') + '>' + escapeHtml(name) + '</option>').join('');
      return '<tr' + (t.reviewed === false ? ' class="tx-new"' : '') + '>' +
        '<td>' + t.date + '</td>' +
        '<td>' + escapeHtml(t.desc) + (t.reviewed === false ? ' <span class="pill new-pill">new</span>' : '') +
          (t.account ? '<div class="tx-account">' + escapeHtml(t.account) + '</div>' : '') +
        '</td>' +
        '<td class="amt ' + (t.amount < 0 ? 'neg' : 'pos') + '">' + fmtMoney(t.amount) + '</td>' +
        '<td><select data-tx="' + t.id + '">' + opts + '</select></td>' +
        '<td>' + (t.reviewed === false ? '<button class="del-btn" data-review="' + t.id + '" title="Mark reviewed">&check;</button>' : '') + '<button class="del-btn" data-del="' + t.id + '" title="Delete">✕</button></td>' +
        '</tr>';
    }).join('');

    app.innerHTML =
      '<header class="top">' +
        '<div class="brand"><h1>Household Ledger</h1><span class="tag">Home Budget</span></div>' +
        '<div class="month-nav">' +
          '<button data-nav="-1">&#8249;</button>' +
          '<span class="label">' + monthLabel(mk) + '</span>' +
          '<button data-nav="1">&#8250;</button>' +
        '</div>' +
        '<div class="sync' + (syncMode === 'local' ? ' local' : '') + '" id="sync-badge"><span class="dot"></span><span>' + (syncMode === 'local' ? 'local only' : 'synced') + '</span></div>' +
      '</header>' +

      '<div class="stats">' +
        '<div class="stat"><div class="k">Budgeted</div><div class="v num">' + fmtMoney(budgeted) + '</div></div>' +
        '<div class="stat"><div class="k">Spent</div><div class="v num ' + (spent > budgeted && budgeted>0 ? 'warn':'') + '">' + fmtMoney(spent) + '</div></div>' +
        '<div class="stat"><div class="k">Remaining</div><div class="v num ' + (remaining < 0 ? 'warn':'good') + '">' + fmtMoney(remaining) + '</div></div>' +
        '<div class="stat"><div class="k">Income</div><div class="v num good">' + fmtMoney(income) + '</div></div>' +
      '</div>' +

      '<div class="grid">' +
        '<div>' +
          (incomeCats.length ? (
            '<div class="card">' +
              '<h2>Income sources</h2>' +
              '<div class="sub">Planned vs. received &mdash; ' + monthLabel(mk) + '</div>' +
              incomeRows +
            '</div>'
          ) : '') +
          '<div class="card">' +
            '<div class="card-head"><h2>Budget vs. actual</h2><div class="card-head-ctl">' +
              '<select class="expand-btn" id="cat-sort-select">' +
                '<option value="alpha"' + (catSort==='alpha'?' selected':'') + '>A &ndash; Z</option>' +
                '<option value="closest"' + (catSort==='closest'?' selected':'') + '>Closest to limit</option>' +
                '<option value="furthest"' + (catSort==='furthest'?' selected':'') + '>Furthest from limit</option>' +
              '</select>' +
              '<button class="expand-btn" data-expand-cats>' + (catsExpanded ? 'Collapse' : 'Expand') + '</button>' +
              (state.txFilters.parents.length ? '<button type="button" class="expand-btn" id="solo-clear-top">Clear filters</button>' : '') +
            '</div></div>' +
            '<div class="sub">' + monthLabel(mk) + '</div>' +
            (soloChips ? '<div class="solo-parents">' + soloChips + '</div>' : '') +
            '<div class="cat-scroll' + (catsExpanded ? ' expanded' : '') + '">' + catRows + '</div>' +
          '</div>' +
          '<div class="card">' +
            '<h2>Transactions</h2>' +
            '<div class="sub">' + (filteredTxs.length === txs.length ? txs.length + ' this month' : filteredTxs.length + ' of ' + txs.length + ' this month') + (newCount ? ' &mdash; <strong>' + newCount + ' new, needs a look</strong>' : '') + '</div>' +
            '<div class="tx-filters">' +
              '<input type="text" id="tx-search" placeholder="Search description or amount…" value="' + escapeHtml(state.txFilters.search) + '">' +
              '<select id="tx-account-filter">' +
                '<option value="all"' + (state.txFilters.account === 'all' ? ' selected' : '') + '>All accounts</option>' +
                accountsInUse.map(a => '<option value="' + escapeHtml(a) + '"' + (a === state.txFilters.account ? ' selected' : '') + '>' + escapeHtml(a) + '</option>').join('') +
              '</select>' +
              '<select id="tx-category-filter">' +
                '<option value="all"' + (state.txFilters.category === 'all' ? ' selected' : '') + '>All categories</option>' +
                optsHtmlBase.map(name => '<option value="' + escapeHtml(name) + '"' + (name === state.txFilters.category ? ' selected' : '') + '>' + escapeHtml(name) + '</option>').join('') +
              '</select>' +
              (filtersActive ? '<button type="button" class="expand-btn" id="tx-clear-filters">Clear filters</button>' : '') +
            '</div>' +
            '<div class="table-wrap"><table class="ledger"><thead><tr><th>Date</th><th>Description</th><th style="text-align:right">Amount</th><th>Category</th><th></th></tr></thead><tbody>' +
              (txRows || '<tr><td colspan="5" class="empty">' + (txs.length ? 'No transactions match your search/filter.' : 'No transactions yet &mdash; upload a bank statement.') + '</td></tr>') +
            '</tbody></table></div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card">' +
            '<h2>Spending breakdown</h2>' +
            '<div class="sub">' + monthLabel(mk) + ' &mdash; ' + fmtMoney(breakdownTotal) + ' spent &mdash; click a slice or legend row to solo it</div>' +
            buildPieSVG(breakdownParents, {selected: state.txFilters.parents, colorFn: colorForGroup}) +
            (parentLegend ? '<div class="legend">' + parentLegend + '</div>' : '') +
            (breakdownSubs.length ? (
              '<div class="legend-divider"></div>' +
              '<div class="legend-heading-row">' +
                '<div class="legend-heading">By sub-category</div>' +
                '<button class="expand-btn" data-expand-subs>' + (subsExpanded ? 'Collapse' : 'Expand') + '</button>' +
              '</div>' +
              '<div class="legend legend-subs' + (subsExpanded ? ' expanded' : '') + '">' + subLegend + '</div>'
            ) : '') +
          '</div>' +
          '<div class="card">' +
            '<h2>Upload data</h2>' +
            '<div class="sub">CSV files only</div>' +
            (state.lastStatementUpload ? '<div class="last-upload-banner"><strong>Last date range uploaded:</strong> ' + fmtDateRange(state.lastStatementUpload) + '</div>' : '') +
            '<div class="upload-block">' +
              '<div class="lbl">Weekly bank statement</div>' +
              '<div class="hint">Download a CSV of your Chase activity for the date range you want to add, then upload it here.</div>' +
              '<input type="file" id="statement-file" accept=".csv,text/csv">' +
              (msg.statement ? '<div class="msg ' + msg.statement.ok + '">' + msg.statement.text + '</div>' : '') +
            '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<footer>Updates save automatically and sync across every open view.</footer>';

    document.getElementById('statement-file').addEventListener('change', onStatementFile);
    const searchEl = document.getElementById('tx-search');
    if(searchEl) searchEl.addEventListener('input', () => {
      state.txFilters.search = searchEl.value;
      const cursor = searchEl.selectionStart;
      render();
      const el = document.getElementById('tx-search');
      if(el){ el.focus(); el.setSelectionRange(cursor, cursor); }
    });
    const acctFilterEl = document.getElementById('tx-account-filter');
    if(acctFilterEl) acctFilterEl.addEventListener('change', () => { state.txFilters.account = acctFilterEl.value; render(); });
    const catFilterEl = document.getElementById('tx-category-filter');
    if(catFilterEl) catFilterEl.addEventListener('change', () => { state.txFilters.category = catFilterEl.value; render(); });
    const clearFiltersEl = document.getElementById('tx-clear-filters');
    if(clearFiltersEl) clearFiltersEl.addEventListener('click', () => {
      state.txFilters = {search: '', account: 'all', category: 'all', parents: []};
      render();
    });
    app.querySelectorAll('[data-solo-parent]').forEach(btn => btn.addEventListener('click', () => {
      const name = btn.dataset.soloParent;
      const idx = state.txFilters.parents.indexOf(name);
      if(idx === -1) state.txFilters.parents.push(name); else state.txFilters.parents.splice(idx, 1);
      render();
    }));
    const soloClearEl = document.getElementById('solo-clear');
    if(soloClearEl) soloClearEl.addEventListener('click', () => { state.txFilters.parents = []; render(); });
    const soloClearTopEl = document.getElementById('solo-clear-top');
    if(soloClearTopEl) soloClearTopEl.addEventListener('click', () => { state.txFilters.parents = []; render(); });
    app.querySelectorAll('[data-nav]').forEach(b => b.addEventListener('click', () => {
      const [y,m] = mk.split('-').map(Number);
      const d = new Date(y, m-1+parseInt(b.dataset.nav,10), 1);
      state.month = d.toISOString().slice(0,7);
      render();
    }));
    app.querySelectorAll('[data-tx]').forEach(sel => sel.addEventListener('change', () => {
      const t = state.transactions.find(t => t.id === sel.dataset.tx);
      if(!t) return;
      t.category = sel.value;
      t.reviewed = true;
      const key = normalizeMerchant(t.desc);
      if(key){
        if(sel.value === 'Uncategorized') delete state.merchantMap[key];
        else state.merchantMap[key] = sel.value;
      }
      const txId = t.id;
      render();
      persist();
      const el = app.querySelector('[data-tx="' + CSS.escape(txId) + '"]');
      if(el) el.scrollIntoView({behavior: 'auto', block: 'nearest'});
    }));
    app.querySelectorAll('[data-review]').forEach(btn => btn.addEventListener('click', () => {
      const t = state.transactions.find(t => t.id === btn.dataset.review);
      if(!t) return;
      t.reviewed = true;
      const txId = t.id;
      render();
      persist();
      const el = app.querySelector('[data-tx="' + CSS.escape(txId) + '"]');
      if(el) el.scrollIntoView({behavior: 'auto', block: 'nearest'});
    }));
    app.querySelectorAll('[data-del]').forEach(btn => btn.addEventListener('click', () => {
      state.transactions = state.transactions.filter(t => t.id !== btn.dataset.del);
      render(); persist();
    }));
    app.querySelectorAll('[data-expand-cats]').forEach(btn => btn.addEventListener('click', () => {
      catsExpanded = !catsExpanded;
      render();
    }));
    app.querySelectorAll('[data-expand-subs]').forEach(btn => btn.addEventListener('click', () => {
      subsExpanded = !subsExpanded;
      render();
    }));
    const sortSel = document.getElementById('cat-sort-select');
    if(sortSel) sortSel.addEventListener('change', () => { catSort = sortSel.value; render(); });
    app.querySelectorAll('[data-solo-parent]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        app.querySelectorAll('[data-solo-parent="' + CSS.escape(el.dataset.soloParent) + '"]').forEach(m => m.classList.add('solo-hover'));
      });
      el.addEventListener('mouseleave', () => {
        app.querySelectorAll('[data-solo-parent="' + CSS.escape(el.dataset.soloParent) + '"]').forEach(m => m.classList.remove('solo-hover'));
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function readFile(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsText(file);
    });
  }

  async function onBudgetFile(e){
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await readFile(file);
      const rows = parseCSV(text);
      const {added, updated} = importBudget(rows);
      msg.budget = {ok:'ok', text: added + ' added, ' + updated + ' updated.'};
    } catch(err){
      msg.budget = {ok:'err', text: 'Could not read that file.'};
    }
    render(); persist();
  }

  async function onStatementFile(e){
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await readFile(file);
      const rows = parseCSV(text);
      const {added, skipped} = importStatement(rows, file.name);
      msg.statement = {ok:'ok', text: added + ' transactions added' + (skipped ? ', ' + skipped + ' duplicates skipped.' : '.')};
    } catch(err){
      msg.statement = {ok:'err', text: 'Could not read that file.'};
    }
    render(); persist();
  }

  render();
}
let appStarted = false;

function startApp(){
  if(appStarted) return;
  appStarted = true;

  stateRef.on('value', snap => {
    const remote = snap.val();
    if(!remote) return;
    const json = JSON.stringify(remote);
    if(json === lastWritten) return;
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, remote);
    state.merchantMap = state.merchantMap || {};
    state.lastStatementUpload = state.lastStatementUpload || null;
    state.txFilters = state.txFilters || {search: '', account: 'all', category: 'all'};
    state.txFilters.parents = state.txFilters.parents || [];
    render();
    setSyncMode('synced');
  }, () => setSyncMode('local'));

  stateRef.once('value').then(snap => {
    const remote = snap.val();
    boot(remote || INITIAL_STATE);
  }).catch(() => boot(INITIAL_STATE));
}

auth.onAuthStateChanged(user => {
  if(user){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    startApp();
  } else {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('app').style.display = 'none';
  }
});

document.getElementById('login-btn').addEventListener('click', () => {
  const email = document.getElementById('login-email').value;
  const password = document.getElementById('login-password').value;
  auth.signInWithEmailAndPassword(email, password)
    .catch(err => alert('Sign-in failed: ' + err.message));
});
</script>
</body>
