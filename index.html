<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Burke Household Ledger</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
</head>
<body>
<meta charset="utf-8">
<title>Burke Household Ledger</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#efe8d9; --paper-raised:#faf7ef; --ink:#2c4650; --ink-soft:#6d8481;
    --accent:#7c9a2e; --accent-strong:#4b6a1d; --accent-soft:#e2ecc9;
    --line:#ddd0b6; --warn:#dd4a3a; --warn-soft:#fadcd8; --gold:#e8ac1a;
    --caution:#e07a1e; --caution-soft:#fbe4c8;
    --shadow: 0 1px 2px rgba(44,70,80,.08), 0 4px 14px rgba(44,70,80,.06);
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --paper:#1c2e35; --paper-raised:#263940; --ink:#f0e9da; --ink-soft:#93a8a3;
      --accent:#b5cf6e; --accent-strong:#d8ea9e; --accent-soft:#3a4b26;
      --line:#3d5158; --warn:#f08a72; --warn-soft:#4d2620; --gold:#f0c94a;
      --caution:#f0a154; --caution-soft:#4d331a;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
    }
  }
  :root[data-theme="dark"]{
    --paper:#1c2e35; --paper-raised:#263940; --ink:#f0e9da; --ink-soft:#93a8a3;
    --accent:#b5cf6e; --accent-strong:#d8ea9e; --accent-soft:#3a4b26;
    --line:#3d5158; --warn:#f08a72; --warn-soft:#4d2620; --gold:#f0c94a;
    --caution:#f0a154; --caution-soft:#4d331a;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.25);
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--paper); color:var(--ink);
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:1180px; margin:0 auto; padding:28px 20px 64px;}
  h1,h2,h3{font-family:'Fraunces', Georgia, serif; margin:0; text-wrap:balance;}
  .num{font-family:'IBM Plex Mono', monospace; font-variant-numeric:tabular-nums;}

  header.top{display:flex; align-items:center; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .brand{display:flex; align-items:baseline; gap:10px;}
  .brand h1{font-size:1.7rem; font-weight:600; letter-spacing:-.01em;}
  .brand .tag{font-size:.72rem; text-transform:uppercase; letter-spacing:.09em; color:var(--ink-soft);}
  .month-nav{display:flex; align-items:center; gap:10px; background:var(--paper-raised); border:1px solid var(--line); border-radius:999px; padding:6px 8px; box-shadow:var(--shadow);}
  .month-nav button{border:none; background:transparent; color:var(--ink); font-size:1rem; width:28px; height:28px; border-radius:50%; cursor:pointer;}
  .month-nav button:hover{background:var(--accent-soft);}
  .month-nav .label{font-family:'Fraunces',serif; font-weight:600; font-size:1rem; min-width:130px; text-align:center;}
  .view-toggle{display:flex; background:var(--paper-raised); border:1px solid var(--line); border-radius:999px; padding:3px; box-shadow:var(--shadow);}
  .view-toggle-btn{border:none; background:transparent; color:var(--ink-soft); font-size:.78rem; font-weight:600; padding:6px 14px; border-radius:999px; cursor:pointer;}
  .view-toggle-btn.active{background:var(--accent); color:#1b2410;}
  .page-tabs{display:flex; background:var(--paper-raised); border:1px solid var(--line); border-radius:999px; padding:3px; box-shadow:var(--shadow);}
  .page-tab-btn{border:none; background:transparent; color:var(--ink-soft); font-size:.8rem; font-weight:600; padding:7px 16px; border-radius:999px; cursor:pointer;}
  .page-tab-btn.active{background:var(--accent); color:#1b2410;}
  .trend-controls{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:20px;}
  .trend-controls select{font-size:.85rem; padding:7px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); max-width:220px;}
  .trend-chart-wrap{position:relative; margin-top:8px; padding-bottom:6px;}
  .trend-svg{display:block; width:100%;}
  .trend-hit{cursor:crosshair;}
  .trend-tooltip{position:absolute; display:none; pointer-events:none; z-index:5; background:var(--paper-raised); border:1px solid var(--line); border-radius:10px; box-shadow:var(--shadow); padding:10px 12px; font-size:.8rem; min-width:150px;}
  .trend-tooltip-title{font-weight:600; margin-bottom:6px; color:var(--ink);}
  .trend-tooltip-row{display:flex; align-items:center; gap:6px; color:var(--ink-soft); margin-bottom:3px;}
  .trend-tooltip-row strong{color:var(--ink); margin-left:auto; font-family:'IBM Plex Mono', monospace;}
  .trend-max-note{font-size:.76rem; color:var(--caution); font-weight:600;}
  .trend-legend{display:flex; flex-direction:column; gap:8px; margin-top:18px;}
  .trend-legend-row{display:flex; align-items:center; gap:8px; font-size:.84rem;}
  .trend-legend-name{color:var(--ink); font-weight:500; flex:0 0 auto; min-width:130px;}
  .trend-legend-figs{color:var(--ink-soft); font-size:.78rem;}
  .trend-rows{display:flex; flex-direction:column; gap:10px;}
  .trend-row{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .trend-row select{font-size:.82rem; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); flex:1 1 130px; min-width:0;}
  .trend-add-wrap{margin-top:14px;}
  .sync{font-size:.72rem; color:var(--ink-soft); display:flex; align-items:center; gap:6px;}
  .sync .dot{width:7px;height:7px;border-radius:50%; background:var(--accent);}
  .sync.local .dot{background:var(--warn);}
  .header-menu{position:relative;}
  .header-menu-btn{border:1px solid var(--line); background:var(--paper-raised); color:var(--ink-soft); font-size:1.1rem; width:36px; height:36px; border-radius:50%; cursor:pointer; box-shadow:var(--shadow); line-height:1;}
  .header-menu-btn:hover{color:var(--ink); background:var(--accent-soft);}
  .header-menu-panel{position:absolute; top:calc(100% + 6px); right:0; display:flex; flex-direction:column; gap:2px; background:var(--paper-raised); border:1px solid var(--line); border-radius:12px; box-shadow:var(--shadow); padding:6px; min-width:160px; z-index:8;}
  .header-menu-panel button{border:none; background:transparent; color:var(--ink); font-size:.84rem; text-align:left; padding:10px 12px; border-radius:8px; cursor:pointer; white-space:nowrap;}
  .header-menu-panel button:hover{background:var(--accent-soft);}
  .header-menu-divider{height:1px; background:var(--line); margin:4px 0;}
  .theme-toggle{display:flex; gap:4px; padding:2px;}
  .theme-opt{flex:1; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); font-size:.78rem; padding:8px 6px; border-radius:8px; cursor:pointer; white-space:nowrap; text-align:center;}
  .theme-opt.active{background:var(--accent); border-color:var(--accent); color:#1b2410; font-weight:600;}
  .theme-opt:hover{background:var(--accent-soft);}
  .theme-opt.active:hover{background:var(--accent);}
  @media (max-width:520px){
    .expand-btn, .view-toggle-btn, .page-tab-btn{padding:10px 14px; min-height:40px;}
    .header-menu-btn{width:44px; height:44px;}
  }

  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:24px;}
  .stat{background:var(--paper-raised); border:1px solid var(--line); border-radius:14px; padding:16px 18px; box-shadow:var(--shadow);}
  .stat .k{font-size:.72rem; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); margin-bottom:6px;}
  .stat .v{font-size:1.55rem; font-weight:600;}
  .stat .v.warn{color:var(--warn);}
  .stat .v.good{color:var(--accent-strong);}

  .grid{display:grid; grid-template-columns:1.6fr 1fr; gap:20px; align-items:start; min-width:0;}
  .grid > div{min-width:0;}
  @media (max-width:880px){ .grid{grid-template-columns:1fr;} .stats{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:520px){ #app{padding:18px 14px 48px;} .stats{grid-template-columns:1fr 1fr; gap:10px;} .stat{padding:12px 14px;} .stat .v{font-size:1.25rem;} .card{padding:16px 16px;} .brand h1{font-size:1.35rem;} header.top{gap:10px;} .month-nav .label{min-width:0; font-size:.9rem;} }

  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:16px; box-shadow:var(--shadow); padding:20px 22px; min-width:0;}
  .card + .card{margin-top:20px;}
  .card h2{font-size:1.05rem; font-weight:600; margin-bottom:4px;}
  .card .sub{font-size:.8rem; color:var(--ink-soft); margin-bottom:16px;}

  .cat-row{display:grid; grid-template-columns:1fr auto; gap:4px 14px; padding:12px 0; border-bottom:1px solid var(--line);}
  .cat-row:last-child{border-bottom:none;}
  .cat-row .name{font-weight:500; display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .cat-row .figures{font-size:.82rem; color:var(--ink-soft); text-align:right;}
  .cat-ctl{display:flex; align-items:center; gap:6px; opacity:.55; flex-wrap:wrap;}
  .cat-ctl:hover{opacity:1;}
  .cat-ctl select{font-size:.75rem; padding:1px 4px; border-radius:5px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); max-width:130px;}
  .cat-ctl button{border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:.85rem; padding:0; line-height:1;}
  .cat-ctl button:hover{color:var(--warn);}
  .add-cat-form{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-top:14px; padding-top:14px; border-top:1px solid var(--line);}
  .add-cat-form input, .add-cat-form select{font-size:.82rem; padding:7px 9px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); flex:1 1 130px; min-width:0;}
  .add-cat-form input[type=number]{flex:0 1 110px;}
  .add-cat-form select{flex:0 1 100px;}
  .cat-edit-form{display:flex; gap:8px; flex-wrap:wrap; align-items:center; padding:10px 0;}
  .cat-edit-form input, .cat-edit-form select{font-size:.82rem; padding:6px 8px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); flex:1 1 120px; min-width:0;}
  .cat-edit-form input.cat-edit-monthly{flex:0 1 100px;}
  .cat-edit-form select{flex:0 1 130px;}
  .income-row{display:grid; grid-template-columns:1fr auto; gap:4px 14px; padding:12px 0; border-bottom:1px solid var(--line); align-items:center;}
  .income-row .name{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  .income-row:last-child{border-bottom:none;}
  .income-row .figures{font-size:.82rem; color:var(--ink-soft); text-align:right;}
  .cat-group{padding-bottom:12px; margin-bottom:12px; border-bottom:1px solid var(--line); border-radius:8px; transition:background-color .3s ease;}
  .cat-group:last-child{border-bottom:none; margin-bottom:0; padding-bottom:0;}
  .cat-group .cat-row, .cat-group .income-row{border-bottom:none;}
  .card-head{display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;}
  .card-head-ctl{display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
  select.expand-btn{-webkit-appearance:none; appearance:none;}
  .card-head h2{margin-bottom:0;}
  .expand-btn{font-size:.72rem; padding:4px 10px; border-radius:999px; border:1px solid var(--line); background:var(--paper); color:var(--ink-soft); cursor:pointer; white-space:nowrap;}
  .expand-btn:hover{background:var(--accent-soft); color:var(--accent-strong);}
  .solo-parents{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px;}
  .solo-chip{font-size:.74rem; padding:5px 12px; border-radius:999px; border:1.5px solid; color:#1b2430; cursor:pointer; font-weight:500; transition:background-color .15s, border-width .15s;}
  .solo-chip.active{border-width:2.5px; font-weight:700;}
  .cat-scroll{max-height:320px; overflow-y:auto; padding-right:6px; margin-right:-6px;}
  .cat-scroll.expanded{max-height:none;}
  .cat-scroll::-webkit-scrollbar{width:8px;}
  .cat-scroll::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}
  .cat-row.cat-child, .income-row.cat-child{padding:6px 0 6px 20px; font-size:.88em;}
  .cat-child .name{font-weight:400; color:var(--ink-soft);}
  .cat-child .figures{font-size:.9em;}
  .cat-row .figures .spent{color:var(--ink); font-weight:600;}
  .cat-row .figures .spent.ok{color:var(--accent-strong);}
  .cat-row .figures .spent.caution{color:var(--caution);}
  .cat-row .figures .spent.over{color:var(--warn);}
  .bar-track{grid-column:1/-1; height:7px; border-radius:5px; background:var(--accent-soft); overflow:hidden;}
  .bar-fill{height:100%; background:var(--accent); border-radius:5px;}
  .bar-fill.caution{background:var(--caution);}
  .bar-fill.over{background:var(--warn);}
  .pill{font-size:.72rem; padding:2px 8px; border-radius:999px; text-transform:uppercase; letter-spacing:.04em; font-weight:600; white-space:nowrap;}
  .pill.ok{background:var(--accent-soft); color:var(--accent-strong);}
  .pill.caution{background:var(--caution-soft); color:var(--caution);}
  .pill.over{background:var(--warn-soft); color:var(--warn);}
  .empty{color:var(--ink-soft); font-size:.9rem; padding:8px 0;}

  .pie-svg{display:block; margin:4px auto 12px; transition:width .25s, height .25s;}
  .pie-slice{cursor:pointer; transition:opacity .15s; opacity:1;}
  .pie-slice.pie-dim{opacity:.32;}
  .pie-slice.solo-hover{opacity:1; filter:brightness(1.12);}
  .legend-row-clickable{cursor:pointer; border-radius:6px; padding:2px 4px; margin:0 -4px; transition:background-color .15s, opacity .15s;}
  .legend-row-clickable:hover, .legend-row-clickable.solo-hover{background:var(--accent-soft);}
  .legend-row-clickable.legend-dim{opacity:.45;}
  .legend{display:flex; flex-direction:column; gap:6px;}
  .legend-row{display:grid; grid-template-columns:10px 1fr auto auto; align-items:center; gap:8px; font-size:.82rem;}
  .legend-row-sub{grid-template-columns:1fr auto auto;}
  .legend-dot{width:10px; height:10px; border-radius:50%;}
  .legend-name{color:var(--ink); overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .legend-pct{color:var(--ink-soft); font-size:.78rem; text-align:right;}
  .legend-amt{color:var(--ink); font-weight:500; text-align:right; min-width:64px;}
  .legend-divider{height:1px; background:var(--line); margin:14px 0;}
  .legend-heading{font-size:.72rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); margin-bottom:10px;}
  .legend-heading-row{display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:10px;}
  .legend-heading-row .legend-heading{margin-bottom:0;}
  .legend-subs{max-height:220px; overflow-y:auto; padding-right:4px;}
  .legend-subs.expanded{max-height:none;}
  .legend-subs::-webkit-scrollbar{width:8px;} .legend-subs::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  .last-upload-banner{background:var(--accent-soft); color:var(--accent-strong); border-left:3px solid var(--accent); border-radius:8px; padding:8px 12px; font-size:.8rem; margin-bottom:14px;}
  .last-upload-banner strong{color:var(--accent-strong);}
  .upload-block{border:1px dashed var(--line); border-radius:12px; padding:14px 16px; margin-bottom:14px;}
  .upload-block:last-child{margin-bottom:0;}
  .upload-block .lbl{font-weight:600; font-size:.88rem; margin-bottom:4px;}
  .upload-block .hint{font-size:.76rem; color:var(--ink-soft); margin-bottom:10px; line-height:1.4;}
  input[type=file]{font-size:.8rem; width:100%; color:var(--ink-soft);}
  .msg{font-size:.78rem; margin-top:8px; padding:6px 10px; border-radius:8px;}
  .msg.ok{background:var(--accent-soft); color:var(--accent-strong);}
  .msg.err{background:var(--warn-soft); color:var(--warn);}

  table.ledger{width:100%; border-collapse:collapse; font-size:.86rem;}
  table.ledger th{text-align:left; font-size:.7rem; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-soft); font-weight:600; padding:0 10px 8px; border-bottom:1px solid var(--line);}
  table.ledger td{padding:9px 10px; border-bottom:1px solid var(--line); vertical-align:middle;}
  table.ledger tr:last-child td{border-bottom:none;}
  table.ledger td.amt{text-align:right; font-family:'IBM Plex Mono',monospace;}
  table.ledger td.amt.neg{color:var(--warn);}
  table.ledger td.amt.pos{color:var(--accent-strong);}
  table.ledger select{font-size:.78rem; padding:3px 6px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); max-width:130px;}
  table.ledger input.tx-date{font-size:.78rem; padding:3px 4px; border-radius:6px; border:1px solid var(--line); background:var(--paper); color:var(--ink); width:124px;}
  .del-btn{border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:.9rem; margin-right:4px;}
  .del-btn:hover{color:var(--warn);}
  .split-inline-btn{border:none; background:transparent; color:var(--ink-soft); cursor:pointer; font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; padding:0; margin-right:6px; text-decoration:underline; text-decoration-color:transparent; transition:color .15s, text-decoration-color .15s;}
  .split-inline-btn:hover{color:var(--accent-strong); text-decoration-color:var(--accent-strong);}
  tr.tx-new{background:var(--caution-soft);}
  .pill.new-pill{background:var(--caution); color:var(--paper-raised); vertical-align:middle;}
  .uncat-nudge{color:var(--warn);}
  .mom-delta{font-weight:600;}
  .mom-delta.mom-up{color:var(--caution);}
  .mom-delta.mom-down{color:var(--accent-strong);}
  .anomaly-card{border-left:3px solid var(--caution); margin-bottom:20px;}
  .anomaly-row{display:flex; justify-content:space-between; align-items:center; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:.86rem;}
  .anomaly-row:last-child{border-bottom:none;}
  .anomaly-name{font-weight:500;}
  .anomaly-figs{color:var(--ink-soft); font-size:.82rem;}
  .anomaly-figs strong{color:var(--caution);}
  .tx-account{font-size:.72rem; color:var(--ink-soft); margin-top:2px;}
  .tx-orig-date{font-size:.7rem; color:var(--ink-soft); margin-top:3px; font-style:italic;}
  .tx-filters{display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px;}
  .tx-filters input[type=text]{flex:1 1 180px; font-size:.82rem; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink);}
  .tx-filters select{flex:0 0 auto; font-size:.82rem; padding:6px 10px; border-radius:8px; border:1px solid var(--line); background:var(--paper); color:var(--ink); max-width:160px;}
  .table-wrap{max-height:420px; overflow:auto;}
  .table-wrap::-webkit-scrollbar{width:8px;} .table-wrap::-webkit-scrollbar-thumb{background:var(--line); border-radius:4px;}

  footer{margin-top:26px; font-size:.75rem; color:var(--ink-soft); text-align:center;}

  .login-overlay{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:
      radial-gradient(circle at 50% 0%, var(--accent-soft) 0%, transparent 55%),
      var(--paper);
    padding:24px; z-index:10;
  }
  .login-card{
    background:var(--paper-raised); border:1px solid var(--line); border-radius:20px;
    box-shadow:0 2px 6px rgba(44,70,80,.1), 0 20px 48px rgba(44,70,80,.14);
    padding:40px 36px; width:100%; max-width:360px; text-align:center;
  }
  .login-mark{
    width:52px; height:52px; margin:0 auto 18px; border-radius:50%;
    background:var(--accent); color:#1b2410; display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; font-size:1.1rem; letter-spacing:.02em;
    box-shadow:0 4px 14px rgba(124,154,46,.35);
  }
  .login-card h1{font-size:1.3rem; margin-bottom:6px; text-wrap:balance;}
  .login-card .sub{font-size:.85rem; color:var(--ink-soft); margin-bottom:26px;}
  .login-card form{display:flex; flex-direction:column; gap:16px;}
  .login-field{display:flex; flex-direction:column; gap:6px; text-align:left;}
  .login-field span{font-size:.7rem; text-transform:uppercase; letter-spacing:.07em; color:var(--ink-soft); font-weight:600;}
  .login-card input{
    font-size:.92rem; padding:11px 13px; border-radius:10px; border:1px solid var(--line);
    background:var(--paper); color:var(--ink); transition:border-color .15s, box-shadow .15s;
  }
  .login-card input:focus{outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft);}
  .login-card button[type=submit]{

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i=0;i<text.length;i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; } else { inQuotes = false; }
      } else field += c;
    } else {
      if(c === '"') inQuotes = true;
      else if(c === ','){ row.push(field); field=''; }
      else if(c === '\n' || c === '\r'){
        if(field !== '' || row.length){ row.push(field); rows.push(row); row=[]; field=''; }
        if(c === '\r' && text[i+1] === '\n') i++;
      } else field += c;
    }
  }
  if(field !== '' || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(c => c.trim() !== ''));
}

function parseAmount(raw){
  if(raw == null) return NaN;
  let s = String(raw).trim();
  if(!s) return NaN;
  let neg = false;
  if(/^\(.*\)$/.test(s)){ neg = true; s = s.slice(1,-1); }
  s = s.replace(/[^0-9.\-]/g, '');
  let n = parseFloat(s);
  if(isNaN(n)) return NaN;
  if(neg) n = -Math.abs(n);
  return n;
}

function parseDate(raw){
  if(!raw) return null;
  const s = String(raw).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if(m) return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m = s.match(/^(\d{1,2})[\/\.](\d{1,2})[\/\.](\d{2,4})/);
  if(m){
    let [_, a, b, y] = m;
    if(y.length === 2) y = '20'+y;
    return y+'-'+a.padStart(2,'0')+'-'+b.padStart(2,'0');
  }
  const d = new Date(s);
  if(!isNaN(d.getTime())) return d.toISOString().slice(0,10);
  return null;
}

    const total = slices.reduce((a,s) => a + s.value, 0);
    const size = 300;
    const selected = (opts && opts.selected) || [];
    const colorFn = (opts && opts.colorFn) || ((name, i) => sliceColor(i, slices.length));

    const toRad = a => a * Math.PI / 180;

      if(frac < 0.05) return '';
      const lx = cx + labelR * Math.cos(toRad(midAngle));

      return '<text x="' + lx + '" y="' + ly + '" text-anchor="middle" dominant-baseline="middle" ' +

      const startAngle = angle;
      const endAngle = angle + sweep;

      const x1 = cx + r * Math.cos(toRad(startAngle));

      const iy2 = cy + r0 * Math.sin(toRad(startAngle));

      const dim = selected.length && !selected.includes(s.name);

        '<title>' + esc(s.name) + ': ' + (frac*100).toFixed(1) + '%</title>' +

    return tokens.join(' ');
  }

  function autoCategory(desc, sourceCategory){
    const key = normalizeMerchant(desc);
    if(key && state.merchantMap[key]){
      const learned = state.merchantMap[key];
      if(learned === 'Uncategorized' || state.categories.some(c => catLabel(c, state.categories) === learned)) return learned;
    }
    if(sourceCategory && sourceCategory.trim()){
      const s = sourceCategory.trim().toLowerCase();
      const exact = state.categories.find(c => c.name.toLowerCase() === s);
      if(exact) return catLabel(exact, state.categories);
    }
    const d = desc.toLowerCase();
    for(const c of state.categories){
      if(c.name && d.includes(c.name.toLowerCase())) return catLabel(c, state.categories);
    }
    return 'Uncategorized';
  }

  function importBudget(rows){
    if(!rows.length) return {added: 0, updated: 0};
    let nameIdx = 0, monthlyIdx = 1, typeIdx = -1, parentIdx = -1, startRow = 0;
    const first = rows[0];
    const headerLikely = first.some(cell => /month/i.test(cell)) || isNaN(parseAmount(first[1]));
    if(headerLikely){
      first.forEach((cell, idx) => {
        const c = (cell||'').trim().toLowerCase();
        if(/month/.test(c)) monthlyIdx = idx;
        else if(/^category$|^name$/.test(c)) nameIdx = idx;
        else if(/parent/.test(c)) parentIdx = idx;
        else if(/type|income|expense/.test(c)) typeIdx = idx;
      });
      startRow = 1;
    }
    let added = 0, updated = 0;
    for(let i=startRow;i<rows.length;i++){
      const row = rows[i];
      const name = row[nameIdx];
      if(!name) continue;
      const val = parseAmount(row[monthlyIdx]);
      if(isNaN(val)) continue;
      const typeRaw = typeIdx >= 0 ? row[typeIdx] : undefined;
      const type = typeRaw && typeRaw.trim() ? (/income/i.test(typeRaw) ? 'income' : 'expense') : undefined;
      const parent = parentIdx >= 0 ? (row[parentIdx] || '').trim() : undefined;
      const existing = state.categories.find(c =>
        c.name.toLowerCase() === name.trim().toLowerCase() &&
        (parentIdx < 0 || (c.parent || '').toLowerCase() === (parent || '').toLowerCase())
      );
      if(existing){
        existing.monthly = val;
        if(type) existing.type = type;
        if(parentIdx >= 0) existing.parent = parent;
        updated++;
      } else {
        state.categories.push({id: uid(), name: name.trim(), monthly: val, type: type || 'expense', parent: parent || undefined});
        added++;
      }
    }
    return {added, updated};
  }

  function groupCategories(cats){
    const byNameLower = new Map(cats.map(c => [c.name.toLowerCase(), c]));
    const childrenMap = new Map();
    const childIds = new Set();
    cats.forEach(c => {
      const p = (c.parent || '').trim();
      if(p && p.toLowerCase() !== c.name.toLowerCase()){
        const key = p.toLowerCase();
        if(!childrenMap.has(key)) childrenMap.set(key, []);
        childrenMap.get(key).push(c);
        childIds.add(c.id);
      }
    });
    const groups = [];
    const seen = new Set();
    cats.forEach(c => {
      if(childIds.has(c.id)) return;
      const key = c.name.toLowerCase();
      if(seen.has(key)) return;
      seen.add(key);
      groups.push({name: c.name, self: c, children: childrenMap.get(key) || []});
    });
    for(const [key, kids] of childrenMap){
      if(byNameLower.has(key) || seen.has(key)) continue;
      seen.add(key);
      groups.push({name: kids[0].parent.trim(), self: null, children: kids});
    }
    return groups;
  }

  function categoryGroupName(c){
    const p = (c.parent || '').trim();
    return (p && p.toLowerCase() !== c.name.toLowerCase()) ? p : c.name;
  }

  const ACCOUNT_LABELS = { '3300': 'Checking', '6935': 'Credit card' };

  function accountLabelFromFilename(fileName){
    if(!fileName) return null;
    const m = fileName.match(/\d{3,6}/);
    if(!m) return null;
    return ACCOUNT_LABELS[m[0]] || null;
  }

  function importStatement(rows, fileName){
    if(!rows.length) return {added: 0, skipped: 0};
    const source = accountLabelFromFilename(fileName);
    let dateIdx = 0, descIdx = 1, amountIdx = 2, sourceCatIdx = -1, startRow = 0;
    const first = rows[0];
    const headerLikely = first.some(cell => /amount|description/i.test(cell)) || isNaN(parseAmount(first[2])) || !parseDate(first[0]);
    if(headerLikely){
      const headers = first.map(cell => (cell||'').trim().toLowerCase());
      headers.forEach((c, idx) => {
        if(/^description$/.test(c)) descIdx = idx;
        else if(/^amount$/.test(c)) amountIdx = idx;
        else if(/^category$/.test(c)) sourceCatIdx = idx;
      });
      let foundDate = -1;
      headers.forEach((c, idx) => { if(foundDate < 0 && /transaction date/.test(c)) foundDate = idx; });
      if(foundDate < 0) headers.forEach((c, idx) => { if(foundDate < 0 && /^date$/.test(c)) foundDate = idx; });
      if(foundDate < 0) headers.forEach((c, idx) => { if(foundDate < 0 && /date/.test(c)) foundDate = idx; });
      if(foundDate >= 0) dateIdx = foundDate;
      startRow = 1;
    }
    let added = 0, skipped = 0, minDate = null, maxDate = null;
    for(let i=startRow;i<rows.length;i++){
      const row = rows[i];
      const date = parseDate(row[dateIdx]);
      const desc = row[descIdx];
      const amount = parseAmount(row[amountIdx]);
      if(!date || isNaN(amount) || !desc) continue;
      if(!minDate || date < minDate) minDate = date;
      if(!maxDate || date > maxDate) maxDate = date;
      const dup = state.transactions.some(t => t.date === date && t.desc === desc.trim() && t.amount === amount);
      if(dup){ skipped++; continue; }
      const sourceCategory = sourceCatIdx >= 0 ? row[sourceCatIdx] : undefined;
      state.transactions.push({id: uid(), date, origDate: date, desc: desc.trim(), amount, category: autoCategory(desc, sourceCategory), reviewed: false, account: source || undefined});
      added++;
    }
    if(minDate && maxDate) state.lastStatementUpload = {from: minDate, to: maxDate};
    return {added, skipped};
  }

  function totalsForMonth(mk){
    const txs = state.transactions.filter(t => monthKey(t.date) === mk);
    const spent = txs.filter(t => t.amount < 0).reduce((a,t) => a - t.amount, 0);
    const income = txs.filter(t => t.amount > 0).reduce((a,t) => a + t.amount, 0);
    const budgeted = state.categories.filter(c => (c.type||'expense') !== 'income').reduce((a,c) => a + c.monthly, 0);
    return {spent, income, budgeted, remaining: budgeted - spent, txs, elapsed: 1};
  }

  function totalsForYear(year){
    const txs = state.transactions.filter(t => monthKey(t.date).slice(0,4) === year);
    const spent = txs.filter(t => t.amount < 0).reduce((a,t) => a - t.amount, 0);
    const income = txs.filter(t => t.amount > 0).reduce((a,t) => a + t.amount, 0);
    const elapsed = monthsElapsedInYear(year);
    const budgeted = state.categories.filter(c => (c.type||'expense') !== 'income').reduce((a,c) => a + c.monthly, 0) * elapsed;
    return {spent, income, budgeted, remaining: budgeted - spent, txs, elapsed};
  }

  function exportData(){
    const blob = new Blob([JSON.stringify(state, null, 2)], {type: 'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'household-ledger-backup-' + new Date().toISOString().slice(0,10) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function wireImportExport(){
    document.querySelectorAll('[data-theme-set]').forEach(btn => btn.addEventListener('click', () => {
      theme = btn.dataset.themeSet;
      try{ localStorage.setItem('ledger-theme', theme); } catch(e){}
      applyTheme();
      render();
    }));
    const signoutBtn = document.getElementById('signout-btn');
    if(signoutBtn) signoutBtn.addEventListener('click', () => firebase.auth().signOut());
    const exportBtn = document.getElementById('export-btn');
    if(exportBtn) exportBtn.addEventListener('click', exportData);
    const importBtn = document.getElementById('import-btn');
    const importInput = document.getElementById('import-input');
    if(!importBtn || !importInput) return;
    importBtn.addEventListener('click', () => importInput.click());
    importInput.addEventListener('change', async () => {
      const file = importInput.files[0];
      importInput.value = '';
      if(!file) return;
      let backup;
      try{
        const text = await readFile(file);
        backup = JSON.parse(text);
      } catch(err){
        alert('Could not read that file: ' + err.message);
        return;
      }
      if(!backup || !Array.isArray(backup.categories) || !Array.isArray(backup.transactions)){
        alert('That file doesn\'t look like a valid Household Ledger backup.');
        return;
      }
      const curDates = state.transactions.map(t => t.date).sort();
      const backupDates = backup.transactions.map(t => t.date).sort();
      const curRange = curDates.length ? curDates[0] + ' to ' + curDates[curDates.length-1] : 'no data';
      const backupRange = backupDates.length ? backupDates[0] + ' to ' + backupDates[backupDates.length-1] : 'no data';
      const msg = 'This will REPLACE all current data with this backup.\n\n' +
        'Current: ' + state.transactions.length + ' transactions (' + curRange + ')\n' +
        'Backup: ' + backup.transactions.length + ' transactions (' + backupRange + ')\n\n' +
        'This cannot be undone. Continue?';
      if(!confirm(msg)) return;
      state.categories = backup.categories;
      state.transactions = backup.transactions;
      state.merchantMap = backup.merchantMap || {};
      state.lastStatementUpload = backup.lastStatementUpload || null;
      state.txFilters = {search: '', account: 'all', category: 'all', parents: []};
      render();
      persist();
      alert('Backup restored.');
    });
  }

  function render(){
    if(page === 'trends'){
      renderTrends();
      return;
    }
    const mk = currentMonth();
    const periodYear = mk.slice(0,4);
    const {spent, income, budgeted, remaining, txs, elapsed} = viewMode === 'year' ? totalsForYear(periodYear) : totalsForMonth(mk);
    const periodMultiplier = viewMode === 'year' ? elapsed : 1;
    const periodLabel = viewMode === 'year' ? periodYear : monthLabel(mk);
    const periodWord = viewMode === 'year' ? 'this year' : 'this month';
    const app = document.getElementById('app');

    const CAUTION_AT = 0.75;

    const expenseCats = state.categories.filter(c => (c.type||'expense') !== 'income');
    const incomeCats = state.categories.filter(c => c.type === 'income');

    const expenseSpent = labels => txs.reduce((a,t) => a - labels.reduce((sum,l) => sum + txAmountForLabel(t,l), 0), 0);
    const incomeActual = labels => txs.filter(t => t.amount > 0).reduce((a,t) => a + labels.reduce((sum,l) => sum + txAmountForLabel(t,l), 0), 0);

    const sortGroups = list => {
      if(catSort === 'closest') return list.slice().sort((a,b) => b.ratio - a.ratio);
      if(catSort === 'furthest') return list.slice().sort((a,b) => a.ratio - b.ratio);
      return list.slice().sort((a,b) => a.name.localeCompare(b.name));
    };

    const K401_INCOME_MAP = {'David': 'David pay', 'Erin': 'Erin pay'};
    const paychecksReceivedFor = incomeLabel => txs.filter(t => t.amount > 0 && t.category === incomeLabel).length;
    const categoryActualSpent = c => {
      if(c.autoDeducted){
        const incomeLabel = c.parent === '401k' ? K401_INCOME_MAP[c.name] : null;
        if(incomeLabel){
          const count = paychecksReceivedFor(incomeLabel);
          return count * (c.monthly / 2);
        }
        return c.monthly * periodMultiplier;
      }
      return expenseSpent([catLabel(c, state.categories)]);
    };

    let prevExpenseSpent = null;
    if(viewMode === 'month'){
      const [py, pm] = mk.split('-').map(Number);
      const prevMk = new Date(py, pm - 2, 1).toISOString().slice(0,7);
      const prevTxs = state.transactions.filter(t => monthKey(t.date) === prevMk);
      prevExpenseSpent = labels => prevTxs.reduce((a,t) => a - labels.reduce((sum,l) => sum + txAmountForLabel(t,l), 0), 0);
    }
    const expenseGroupsRaw = groupCategories(expenseCats).map(g => {
      const kids = g.children.slice().sort((a,b) => a.name.localeCompare(b.name));
      const labels = [...(g.self ? [catLabel(g.self, state.categories)] : []), ...kids.map(k => catLabel(k, state.categories))];
      const monthly = ((g.self ? g.self.monthly : 0) + kids.reduce((a,k) => a + k.monthly, 0)) * periodMultiplier;
      const txSpent = expenseSpent(labels);
      const catSpent = (g.self ? categoryActualSpent(g.self) : 0) + kids.reduce((a,k) => a + categoryActualSpent(k), 0);
      const allAutoDeducted = (!g.self || g.self.autoDeducted) && kids.length > 0 && kids.every(k => k.autoDeducted);
      const ratio = monthly > 0 ? catSpent / monthly : (catSpent > 0 ? Infinity : 0);
      const prevTxSpent = prevExpenseSpent ? prevExpenseSpent(labels) : null;
      const momDelta = (prevTxSpent && prevTxSpent > 0) ? ((txSpent - prevTxSpent) / prevTxSpent * 100) : null;
      return {...g, kids, monthly, catSpent, txSpent, ratio, allAutoDeducted, momDelta};
    });

    function catControlsHtml(c){
      return '<span class="cat-ctl">' +
        '<button type="button" data-cat-edit="' + escapeHtml(c.id) + '" title="Edit">&#9998;</button>' +
        '<button type="button" data-cat-delete="' + escapeHtml(c.id) + '" title="Delete">&#10005;</button>' +
      '</span>';
    }
    function catEditFormHtml(c){
      return '<div class="cat-row cat-child cat-edit-form" data-cat-edit-id="' + escapeHtml(c.id) + '">' +
        '<input type="text" class="cat-edit-name" list="cat-edit-name-list" value="' + escapeHtml(c.name) + '" placeholder="Name">' +
        '<datalist id="cat-edit-name-list">' + Array.from(new Set(state.categories.map(cc => cc.name))).map(n => '<option value="' + escapeHtml(n) + '">').join('') + '</datalist>' +
        '<select class="cat-edit-parent-select">' +
          '<option value="">No parent (top-level)</option>' +
          expenseGroupsRaw.map(g => '<option value="' + escapeHtml(g.name) + '"' + (c.parent === g.name ? ' selected' : '') + '>' + escapeHtml(g.name) + '</option>').join('') +
          '<option value="__new__">+ New group&hellip;</option>' +
        '</select>' +
        '<input type="text" class="cat-edit-parent-new" placeholder="New group name" style="display:none">' +
        '<input type="number" class="cat-edit-monthly" value="' + c.monthly + '" step="0.01" min="0" placeholder="Monthly budget">' +
        '<button type="button" class="expand-btn" data-cat-save="' + escapeHtml(c.id) + '">Save</button>' +
        '<button type="button" class="expand-btn" data-cat-edit-cancel>Cancel</button>' +
      '</div>';
    }

    let anomalies = [];
    if(viewMode === 'month'){
      const [ay, am] = mk.split('-').map(Number);
      const monthsWithData = new Set(state.transactions.map(t => monthKey(t.date)));
      const trailing = [];
      for(let i = 1; i <= 6; i++){
        const tm = new Date(ay, am - 1 - i, 1).toISOString().slice(0,7);
        if(monthsWithData.has(tm)) trailing.push(tm);
      }
      if(trailing.length >= 2){
        expenseGroupsRaw.forEach(g => {
          if(g.txSpent < 20) return;
          const labels = [...(g.self ? [catLabel(g.self, state.categories)] : []), ...g.kids.map(k => catLabel(k, state.categories))];
          const vals = trailing.map(tm => {
            const tmTxs = state.transactions.filter(t => monthKey(t.date) === tm);
            return tmTxs.reduce((a,t) => a - labels.reduce((s,l) => s + txAmountForLabel(t,l), 0), 0);
          });
          const avg = vals.reduce((a,v) => a + v, 0) / vals.length;
          if(avg > 0 && g.txSpent > avg * 1.3){
            anomalies.push({name: g.name, current: g.txSpent, avg, pct: Math.round((g.txSpent/avg - 1) * 100)});
          }
        });
        anomalies.sort((a,b) => b.pct - a.pct);
        anomalies = anomalies.slice(0, 3);
      }
    }

    const investmentCatMatchers = [
      {name: 'David', parent: '401k'},
      {name: 'Erin', parent: '401k'},
      {name: '529 Contributions', parent: 'Hazel'},
      {name: '529 Contributions', parent: 'Frank'},
      {name: 'Savings', parent: 'Savings / Investments'},
      {name: 'Investment account', parent: 'Savings / Investments'}
    ];
    const investmentCats = state.categories.filter(c => investmentCatMatchers.some(m => m.name === c.name && c.parent === m.parent));
    const invested = investmentCats.reduce((a,c) => a + categoryActualSpent(c), 0);

    const allGroupNamesSorted = expenseGroupsRaw.map(g => g.name).slice().sort((a,b) => a.localeCompare(b));
    const colorForGroup = name => sliceColor(allGroupNamesSorted.indexOf(name), allGroupNamesSorted.length);

    const breakdownParents = expenseGroupsRaw
      .filter(g => g.txSpent > 0)
      .map(g => ({name: g.name, value: g.txSpent}))
      .sort((a,b) => b.value - a.value);
    const breakdownSubs = [];
    expenseGroupsRaw.forEach(g => {
      if(g.self){
        const selfSpent = expenseSpent([catLabel(g.self, state.categories)]);
        breakdownSubs.push({name: catLabel(g.self, state.categories), value: selfSpent});
      }
      g.kids.forEach(k => {
        const kSpent = expenseSpent([catLabel(k, state.categories)]);
        breakdownSubs.push({name: catLabel(k, state.categories), value: kSpent});
      });
    });
    breakdownSubs.sort((a,b) => b.value - a.value);
    const breakdownTotal = breakdownParents.reduce((a,s) => a + s.value, 0);

    const parentLegend = breakdownParents.map((s, i) => {
      const pct = breakdownTotal > 0 ? (s.value / breakdownTotal * 100) : 0;
      const dim = state.txFilters.parents.length && !state.txFilters.parents.includes(s.name);
      return '<div class="legend-row legend-row-clickable' + (dim ? ' legend-dim' : '') + '" data-solo-parent="' + escapeHtml(s.name) + '">' +
        '<span class="legend-dot" style="background:' + colorForGroup(s.name) + '"></span>' +
        '<span class="legend-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="legend-pct num">' + pct.toFixed(1) + '%</span>' +
        '<span class="legend-amt num">' + fmtMoney(s.value) + '</span>' +
      '</div>';
    }).join('');
    const subLegend = breakdownSubs.map(s => {
      const pct = breakdownTotal > 0 ? (s.value / breakdownTotal * 100) : 0;
      return '<div class="legend-row legend-row-sub">' +
        '<span class="legend-name">' + escapeHtml(s.name) + '</span>' +
        '<span class="legend-pct num">' + pct.toFixed(1) + '%</span>' +
        '<span class="legend-amt num">' + fmtMoney(s.value) + '</span>' +
      '</div>';
    }).join('');

    const soloedGroupsRaw = state.txFilters.parents.length
      ? expenseGroupsRaw.filter(g => state.txFilters.parents.includes(g.name))
      : expenseGroupsRaw;
    const soloChips = expenseGroupsRaw.map((g) => {
      const active = state.txFilters.parents.includes(g.name);
      const solid = colorForGroup(g.name);
      const faded = solid.replace(')', ' / .3)');
      const style = 'background:' + (active ? solid : faded) + '; border-color:' + solid + ';';
      return '<button type="button" class="solo-chip' + (active ? ' active' : '') + '" style="' + style + '" data-solo-parent="' + escapeHtml(g.name) + '">' + escapeHtml(g.name) + '</button>';
    }).join('') + (state.txFilters.parents.length ? '<button type="button" class="expand-btn" id="solo-clear">Clear filters</button>' : '');
    const catRows = soloedGroupsRaw.length ? sortGroups(soloedGroupsRaw).map(g => {
      const {kids, monthly, catSpent, ratio, allAutoDeducted, momDelta} = g;
      const pct = Math.min(100, ratio * 100);
      const status = allAutoDeducted ? 'ok' : (ratio > 1 ? 'over' : (ratio >= CAUTION_AT ? 'caution' : 'ok'));
      const statusLabel = allAutoDeducted ? 'auto-deducted' : (status === 'over' ? 'over budget' : status === 'caution' ? 'watch spending' : 'on track');
      const remain = monthly - catSpent;
      const momHtml = (momDelta !== null && Math.abs(momDelta) >= 1)
        ? '<span class="mom-delta ' + (momDelta > 0 ? 'mom-up' : 'mom-down') + '">' + (momDelta > 0 ? '&#9650;' : '&#9660;') + ' ' + Math.abs(Math.round(momDelta)) + '% vs last month</span>'
        : '';
      const childRows = kids.map(k => {
        if(editingCatId === k.id) return catEditFormHtml(k);
        if(k.autoDeducted){
          const incomeLabel = k.parent === '401k' ? K401_INCOME_MAP[k.name] : null;
          if(incomeLabel){
            const expectedPaychecks = periodMultiplier * 2;
            const count = Math.min(paychecksReceivedFor(incomeLabel), expectedPaychecks);
            const kSpent = categoryActualSpent(k);
            const kBudget = k.monthly * periodMultiplier;
            return '<div class="cat-row cat-child">' +
              '<div class="name">' + escapeHtml(k.name) + ' <span class="pill" style="background:var(--line); color:var(--ink-soft);">auto-deducted</span>' + catControlsHtml(k) + '</div>' +
              '<div class="figures"><span class="num">' + fmtMoney(kSpent) + ' / ' + fmtMoney(kBudget) + '</span><div class="tx-account">' + count + ' of ' + expectedPaychecks + ' paychecks</div></div>' +
            '</div>';
          }
          return '<div class="cat-row cat-child">' +
            '<div class="name">' + escapeHtml(k.name) + ' <span class="pill" style="background:var(--line); color:var(--ink-soft);">auto-deducted</span>' + catControlsHtml(k) + '</div>' +
            '<div class="figures"><span class="num">' + fmtMoney(k.monthly * periodMultiplier) + ' / paycheck</span></div>' +
          '</div>';
        }
        const kSpent = expenseSpent([catLabel(k, state.categories)]);
        const kBudget = k.monthly * periodMultiplier;
        const kRatio = kBudget > 0 ? kSpent / kBudget : (kSpent > 0 ? Infinity : 0);
        const kStatus = kRatio > 1 ? 'over' : (kRatio >= CAUTION_AT ? 'caution' : 'ok');
        return '<div class="cat-row cat-child">' +
          '<div class="name">' + escapeHtml(k.name) + catControlsHtml(k) + '</div>' +
          '<div class="figures"><span class="spent num ' + kStatus + '">' + fmtMoney(kSpent) + '</span> / <span class="num">' + fmtMoney(kBudget) + '</span></div>' +
        '</div>';
      }).join('');

      render();
    }));
    app.querySelectorAll('[data-cat-edit-cancel]').forEach(btn => btn.addEventListener('click', () => {
      editingCatId = null;
      render();
    }));
    app.querySelectorAll('.cat-edit-parent-select').forEach(sel => sel.addEventListener('change', () => {
      const newInput = sel.parentElement.querySelector('.cat-edit-parent-new');
      if(sel.value === '__new__'){
        newInput.style.display = '';
        newInput.focus();
      } else {
        newInput.style.display = 'none';
        newInput.value = '';
      }
    }));
    app.querySelectorAll('[data-cat-save]').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.catSave;
      const c = state.categories.find(cat => cat.id === id);
      if(!c) return;
      const form = btn.closest('.cat-edit-form');
      const name = form.querySelector('.cat-edit-name').value.trim();
      if(!name) return;
      const parentSelectVal = form.querySelector('.cat-edit-parent-select').value;
      const parent = parentSelectVal === '__new__' ? form.querySelector('.cat-edit-parent-new').value.trim() : parentSelectVal;
      if(state.categories.some(cat => cat.id !== id && cat.name.toLowerCase() === name.toLowerCase() && (cat.parent||'') === parent)){
        alert('A category named "' + name + '" already exists' + (parent ? ' under ' + parent : '') + '.');
        return;
      }
      const monthly = parseFloat(form.querySelector('.cat-edit-monthly').value) || 0;
      const oldLabel = catLabel(c, state.categories);
      c.name = name;
      c.parent = parent;
      c.monthly = monthly;
      const newLabel = catLabel(c, state.categories);
      if(oldLabel !== newLabel){
        state.transactions.forEach(t => {
          if(t.category === oldLabel) t.category = newLabel;
          if(t.splits) t.splits.forEach(s => { if(s.category === oldLabel) s.category = newLabel; });
        });
        Object.keys(state.merchantMap).forEach(k => { if(state.merchantMap[k] === oldLabel) state.merchantMap[k] = newLabel; });
      }
      editingCatId = null;
      render();
      persist();
    }));
    app.querySelectorAll('[data-cat-delete]').forEach(btn => btn.addEventListener('click', () => {
      const id = btn.dataset.catDelete;
      const c = state.categories.find(cat => cat.id === id);
      if(!c) return;
      const label = catLabel(c, state.categories);
      const affected = state.transactions.filter(t => t.category === label || (t.splits && t.splits.some(s => s.category === label))).length;
      const msg = 'Delete category "' + c.name + '"?' + (affected ? '\n\n' + affected + ' transaction(s) reference it and will be moved to Uncategorized.' : '') + '\n\nThis cannot be undone.';
      if(!confirm(msg)) return;
      state.categories = state.categories.filter(cat => cat.id !== id);
      state.transactions.forEach(t => {
        if(t.category === label) t.category = 'Uncategorized';
        if(t.splits) t.splits.forEach(s => { if(s.category === label) s.category = 'Uncategorized'; });
      });
      Object.keys(state.merchantMap).forEach(k => { if(state.merchantMap[k] === label) delete state.merchantMap[k]; });
      editingCatId = null;
      render();
      persist();
    }));
    app.querySelectorAll('[data-split-start]').forEach(btn => btn.addEventListener('click', () => {
      const t = state.transactions.find(t => t.id === btn.dataset.splitStart);
      if(!t) return;
      splitEditingId = t.id;
      splitDraft = [
        {amount: Math.abs(t.amount).toFixed(2), category: t.category && t.category !== 'Uncategorized' ? t.category : 'Uncategorized'},
        {amount: '', category: 'Uncategorized'}
      ];
      render();
    }));
    app.querySelectorAll('[data-split-edit]').forEach(btn => btn.addEventListener('click', () => {
      const t = state.transactions.find(t => t.id === btn.dataset.splitEdit);
      if(!t || !t.splits) return;
      splitEditingId = t.id;
      splitDraft = t.splits.map(s => ({amount: Math.abs(s.amount).toFixed(2), category: s.category}));
      render();
    }));
    app.querySelectorAll('[data-split-undo]').forEach(btn => btn.addEventListener('click', () => {
      const t = state.transactions.find(t => t.id === btn.dataset.splitUndo);
      if(!t) return;
      delete t.splits;
      renderKeepingScroll(); persist();
    }));
    app.querySelectorAll('[data-split-cancel]').forEach(btn => btn.addEventListener('click', () => {
      splitEditingId = null;
      splitDraft = null;
      render();
    }));
    app.querySelectorAll('[data-split-add]').forEach(btn => btn.addEventListener('click', () => {
      if(splitDraft && splitDraft.length < 5) splitDraft.push({amount: '', category: 'Uncategorized'});
      render();
    }));
    app.querySelectorAll('[data-split-remove]').forEach(btn => btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.splitRemove, 10);
      if(splitDraft) splitDraft.splice(idx, 1);
      render();
    }));
    app.querySelectorAll('.split-amt').forEach(inp => inp.addEventListener('input', () => {
      if(!splitDraft) return;
      const idx = parseInt(inp.dataset.splitIdx, 10);
      splitDraft[idx].amount = inp.value;
      const t = state.transactions.find(t => t.id === splitEditingId);
      const container = inp.closest('.split-editor');
      const remainEl = container ? container.querySelector('.split-remaining') : null;
      if(remainEl && t){
        const allocated = splitDraft.reduce((a,s) => a + (parseFloat(s.amount) || 0), 0);
        const remaining = Math.abs(t.amount) - allocated;
        remainEl.textContent = fmtMoney(remaining) + ' remaining';
        remainEl.classList.toggle('warn', Math.abs(remaining) > 0.001);
      }
    }));
    app.querySelectorAll('.split-cat').forEach(sel => sel.addEventListener('change', () => {
      if(!splitDraft) return;
      const idx = parseInt(sel.dataset.splitIdx, 10);
      splitDraft[idx].category = sel.value;
    }));
    app.querySelectorAll('[data-split-save]').forEach(btn => btn.addEventListener('click', () => {
      const t = state.transactions.find(t => t.id === btn.dataset.splitSave);
      if(!t || !splitDraft) return;
      const sign = t.amount < 0 ? -1 : 1;
      const splits = splitDraft
        .map(s => ({category: s.category, amount: sign * Math.abs(parseFloat(s.amount) || 0)}))
        .filter(s => s.amount !== 0);
      if(splits.length < 2) return;
      t.splits = splits;
      t.reviewed = true;
      splitEditingId = null;
      splitDraft = null;
      renderKeepingScroll();
      persist();
    }));
    app.querySelectorAll('[data-solo-parent]').forEach(el => {
      el.addEventListener('mouseenter', () => {
        app.querySelectorAll('[data-solo-parent="' + CSS.escape(el.dataset.soloParent) + '"]').forEach(m => m.classList.add('solo-hover'));
      });
      el.addEventListener('mouseleave', () => {
        app.querySelectorAll('[data-solo-parent="' + CSS.escape(el.dataset.soloParent) + '"]').forEach(m => m.classList.remove('solo-hover'));
      });
    });
  }

  function renderTrends(){
    const app = document.getElementById('app');
    const expenseCats = state.categories.filter(c => (c.type||'expense') !== 'income');
    const groups = groupCategories(expenseCats).slice().sort((a,b) => a.name.localeCompare(b.name));
    if(!groups.length){
      app.innerHTML = '<div class="empty">No categories yet.</div>';
      return;
    }

    function subOptionsFor(groupName){
      const g = groups.find(gr => gr.name === groupName);
      if(!g) return [{value: 'all', label: 'All'}];
      const sortedKids = g.children.slice().sort((a,b) => a.name.localeCompare(b.name));
      return [{value: 'all', label: 'All of ' + g.name}]
        .concat(g.self ? [{value: catLabel(g.self, state.categories), label: g.self.name}] : [])
        .concat(sortedKids.map(k => ({value: catLabel(k, state.categories), label: k.name})));
    }
    function seriesForRow(row){
      const g = groups.find(gr => gr.name === row.group) || groups[0];
      const sortedKids = g.children.slice().sort((a,b) => a.name.localeCompare(b.name));
      if(row.sub === 'all'){
        const labels = (g.self ? [catLabel(g.self, state.categories)] : []).concat(sortedKids.map(k => catLabel(k, state.categories)));
        const budgetMonthly = (g.self ? g.self.monthly : 0) + sortedKids.reduce((a,k) => a + k.monthly, 0);
        return {name: g.name + ' (all)', labels, budgetMonthly, groupName: g.name};
      }
      const matched = state.categories.find(c => catLabel(c, state.categories) === row.sub);
      return {name: matched ? matched.name : row.sub, labels: [row.sub], budgetMonthly: matched ? matched.monthly : 0, groupName: g.name};
    }

    if(!trendsRows || !trendsRows.length) trendsRows = [{group: groups[0].name, sub: 'all'}];
    trendsRows = trendsRows.slice(0, TRENDS_MAX).map(r => groups.find(g => g.name === r.group) ? r : {group: groups[0].name, sub: 'all'});
    const selectedSeries = trendsRows.map(seriesForRow);

    const allMonths = Array.from(new Set(state.transactions.map(t => monthKey(t.date)))).sort();
    let periods;
    if(trendsGranularity === 'year'){
      const years = Array.from(new Set(allMonths.map(m => m.slice(0,4)))).sort();
      periods = years.map(y => ({key: y, label: y}));
    } else {
      periods = allMonths.slice(-12).map(m => ({key: m, label: monthLabel(m).split(' ')[0]}));
    }
    const periodTxsList = periods.map(p => trendsGranularity === 'year'
      ? state.transactions.filter(t => monthKey(t.date).slice(0,4) === p.key)
      : state.transactions.filter(t => monthKey(t.date) === p.key));

    const investmentMatchers = [
      {name: 'David', parent: '401k', incomeLabel: 'David pay'},
      {name: 'Erin', parent: '401k', incomeLabel: 'Erin pay'},
      {name: '529 Contributions', parent: 'Hazel'},
      {name: '529 Contributions', parent: 'Frank'},
      {name: 'Savings', parent: 'Savings / Investments'},
      {name: 'Investment account', parent: 'Savings / Investments'}
    ];
    const investmentCats = state.categories.filter(c => investmentMatchers.some(m => m.name === c.name && c.parent === m.parent));
    function investedForPeriodTxs(periodTxs){
      return investmentCats.reduce((sum, c) => {
        const m = investmentMatchers.find(mm => mm.name === c.name && c.parent === mm.parent);
        if(c.autoDeducted && m && m.incomeLabel){
          const count = periodTxs.filter(t => t.amount > 0 && t.category === m.incomeLabel).length;
          return sum + count * (c.monthly / 2);
        }
        const label = catLabel(c, state.categories);
        const raw = periodTxs.reduce((a,t) => a + txAmountForLabel(t, label), 0);
        return sum - raw;
      }, 0);
    }
    const savingsRows = periods.map((p, i) => {
      const periodTxs = periodTxsList[i];
      const periodIncome = periodTxs.filter(t => t.amount > 0).reduce((a,t) => a + t.amount, 0);
      const periodInvested = investedForPeriodTxs(periodTxs);
      const rate = periodIncome > 0 ? (periodInvested / periodIncome * 100) : null;
      return {label: p.label, income: periodIncome, invested: periodInvested, rate};
    });
    const avgRate = (() => {
      const withRate = savingsRows.filter(r => r.rate !== null);
      return withRate.length ? withRate.reduce((a,r) => a + r.rate, 0) / withRate.length : null;
    })();

    const seriesCount = Math.max(selectedSeries.length, 1);
    const seriesData = selectedSeries.map((s, i) => {
      const values = periodTxsList.map(periodTxs => periodTxs.reduce((a,t) => a - s.labels.reduce((sum,l) => sum + txAmountForLabel(t,l), 0), 0));
      const total = values.reduce((a,v) => a + v, 0);
      const avg = values.length ? total / values.length : 0;
      const highest = values.reduce((a,v) => Math.max(a,v), -Infinity);
      const color = sliceColor(i, seriesCount);
      return {series: s, values, total, avg, highest, color};
    });

    const maxVal = Math.max(1, ...seriesData.flatMap(sd => sd.values));

    const chartH = 320, padTop = 30, padBottom = 42, padLeft = 12, padRight = 12;
    const plotH = chartH - padTop - padBottom;
    const chartW = 960;
    const plotW = chartW - padLeft - padRight;
    const stepX = periods.length > 1 ? plotW / (periods.length - 1) : 0;
    const xFor = i => padLeft + (periods.length > 1 ? i * stepX : plotW/2);
    const yFor = v => padTop + (plotH - Math.max(0, Math.min(1, v/maxVal)) * plotH);

    let linesSvg = '';
    seriesData.forEach(sd => {
      const pts = sd.values.map((v,i) => xFor(i) + ',' + yFor(v)).join(' ');
      linesSvg += '<polyline points="' + pts + '" fill="none" stroke="' + sd.color + '" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"></polyline>';
      sd.values.forEach((v,i) => {
        linesSvg += '<circle cx="' + xFor(i) + '" cy="' + yFor(v) + '" r="4" fill="' + sd.color + '"></circle>';
      });
    });
    if(seriesData.length === 1 && seriesData[0].series.budgetMonthly > 0){
      const budgetLine = trendsGranularity === 'year' ? seriesData[0].series.budgetMonthly * 12 : seriesData[0].series.budgetMonthly;
      const by = yFor(budgetLine);
      linesSvg = '<line x1="' + padLeft + '" y1="' + by + '" x2="' + (chartW-padRight) + '" y2="' + by + '" stroke="var(--ink-soft)" stroke-width="1" stroke-dasharray="4,4"></line>' +
        '<text x="' + padLeft + '" y="' + (by - 8) + '" font-size="20" font-weight="600" fill="var(--ink-soft)">budget ' + fmtMoney(budgetLine) + '</text>' + linesSvg;
    }
    let axisSvg = '';
    let hitSvg = '';
    periods.forEach((p,i) => {
      const anchor = periods.length > 1 && i === 0 ? 'start' : (periods.length > 1 && i === periods.length - 1 ? 'end' : 'middle');
      axisSvg += '<text x="' + xFor(i) + '" y="' + (chartH - 18) + '" text-anchor="' + anchor + '" font-size="22" fill="var(--ink-soft)">' + escapeHtml(String(p.label)) + '</text>';
      const hitW = periods.length > 1 ? stepX : plotW;
      const hx = Math.max(0, xFor(i) - hitW/2);
      hitSvg += '<rect class="trend-hit" data-period-idx="' + i + '" x="' + hx + '" y="0" width="' + hitW + '" height="' + chartH + '" fill="transparent"></rect>';
    });
    const chartSvg = '<svg viewBox="0 0 ' + chartW + ' ' + chartH + '" width="100%" height="' + chartH + '" preserveAspectRatio="xMidYMid meet" class="trend-svg">' + linesSvg + axisSvg + hitSvg + '</svg>';

    const legendHtml = seriesData.map(sd => (
      '<div class="trend-legend-row">' +
        '<span class="legend-dot" style="background:' + sd.color + '"></span>' +
        '<span class="trend-legend-name">' + escapeHtml(sd.series.name) + '</span>' +
        '<span class="trend-legend-figs num">avg ' + fmtMoney(sd.avg) + ' &middot; total ' + fmtMoney(sd.total) + '</span>' +
      '</div>'
    )).join('');

    const rowsHtml = trendsRows.map((row, i) => {
      const subOpts = subOptionsFor(row.group);
      return '<div class="trend-row">' +
        '<select data-row-idx="' + i + '" class="trend-row-group">' + groups.map(g => '<option value="' + escapeHtml(g.name) + '"' + (g.name === row.group ? ' selected' : '') + '>' + escapeHtml(g.name) + '</option>').join('') + '</select>' +
        '<select data-row-idx="' + i + '" class="trend-row-sub">' + subOpts.map(o => '<option value="' + escapeHtml(o.value) + '"' + (o.value === row.sub ? ' selected' : '') + '>' + escapeHtml(o.label) + '</option>').join('') + '</select>' +
        (trendsRows.length > 1 ? '<button type="button" class="del-btn" data-row-remove="' + i + '" title="Remove">&#10005;</button>' : '') +
      '</div>';
    }).join('');
    const addRowHtml = trendsRows.length < TRENDS_MAX ? '<button type="button" class="expand-btn" id="trend-add-row">+ Add new</button>' : '<span class="trend-max-note">Up to ' + TRENDS_MAX + ' at a time</span>';

    app.innerHTML =
      '<header class="top">' +
        '<div class="brand"><h1>Burke Household Ledger</h1><span class="tag">Home Budget</span></div>' +
        '<div class="page-tabs">' +
          '<button type="button" class="page-tab-btn" data-page="ledger">Ledger</button>' +
          '<button type="button" class="page-tab-btn active" data-page="trends">Trends</button>' +
        '</div>' +
        headerActionsHtml() +
      '</header>' +
      '<div class="grid">' +
        '<div>' +
          '<div class="card">' +
            '<h2>Spending Trends</h2>' +
            '<div class="sub">Compare up to ' + TRENDS_MAX + ' categories or subcategories over time.</div>' +
            '<div class="trend-controls">' +
              '<div class="view-toggle">' +
                '<button type="button" class="view-toggle-btn' + (trendsGranularity === 'month' ? ' active' : '') + '" data-trend-gran="month">Monthly</button>' +
                '<button type="button" class="view-toggle-btn' + (trendsGranularity === 'year' ? ' active' : '') + '" data-trend-gran="year">Yearly</button>' +
              '</div>' +
            '</div>' +
            (seriesData.length ? '<div class="trend-chart-wrap">' + chartSvg + '<div class="trend-tooltip" id="trend-tooltip"></div></div>' : '<div class="empty">No transaction data yet to chart.</div>') +
            '<div class="trend-legend">' + legendHtml + '</div>' +
          '</div>' +
        '</div>' +
        '<div>' +
          '<div class="card">' +
            '<h2>Categories</h2>' +
            '<div class="sub">Pick a category (and optional subcategory) per line</div>' +
            '<div class="trend-rows">' + rowsHtml + '</div>' +
            '<div class="trend-add-wrap">' + addRowHtml + '</div>' +
          '</div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2>Savings Rate</h2>' +
        '<div class="sub">Invested as a share of income, per ' + (trendsGranularity === 'year' ? 'year' : 'month') + (avgRate !== null ? ' &mdash; average ' + Math.round(avgRate) + '%' : '') + '</div>' +
        '<table class="ledger savings-rate-table"><thead><tr><th>' + (trendsGranularity === 'year' ? 'Year' : 'Month') + '</th><th style="text-align:right">Income</th><th style="text-align:right">Invested</th><th style="text-align:right">Rate</th></tr></thead><tbody>' +
          savingsRows.map(r => (
            '<tr><td>' + escapeHtml(String(r.label)) + '</td>' +
            '<td class="amt">' + fmtMoney(r.income) + '</td>' +
            '<td class="amt">' + fmtMoney(r.invested) + '</td>' +
            '<td class="amt">' + (r.rate !== null ? Math.round(r.rate) + '%' : '&mdash;') + '</td></tr>'
          )).join('') +
        '</tbody></table>' +
      '</div>';

    wireImportExport();
    const headerMenuToggle = document.getElementById('header-menu-toggle');
    if(headerMenuToggle) headerMenuToggle.addEventListener('click', (e) => { e.stopPropagation(); headerMenuOpen = !headerMenuOpen; render(); });
    app.querySelectorAll('[data-page]').forEach(b => b.addEventListener('click', () => { page = b.dataset.page; render(); }));
    app.querySelectorAll('[data-trend-gran]').forEach(b => b.addEventListener('click', () => { trendsGranularity = b.dataset.trendGran; render(); }));
    app.querySelectorAll('.trend-row-group').forEach(sel => sel.addEventListener('change', () => {
      const idx = parseInt(sel.dataset.rowIdx, 10);
      trendsRows[idx] = {group: sel.value, sub: 'all'};
      render();
    }));
    app.querySelectorAll('.trend-row-sub').forEach(sel => sel.addEventListener('change', () => {
      const idx = parseInt(sel.dataset.rowIdx, 10);
      trendsRows[idx].sub = sel.value;
      render();
    }));
    app.querySelectorAll('[data-row-remove]').forEach(btn => btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.rowRemove, 10);
      trendsRows.splice(idx, 1);
      render();
    }));
    const addBtn = document.getElementById('trend-add-row');
    if(addBtn) addBtn.addEventListener('click', () => {
      const usedGroups = trendsRows.map(r => r.group);
      const nextGroup = groups.find(g => !usedGroups.includes(g.name)) || groups[0];
      trendsRows.push({group: nextGroup.name, sub: 'all'});
      render();
    });
    const tooltipEl = document.getElementById('trend-tooltip');
    const wrapEl = app.querySelector('.trend-chart-wrap');
    function positionTooltip(e){
      const rect = wrapEl.getBoundingClientRect();
      tooltipEl.style.left = (e.clientX - rect.left + 14) + 'px';
      tooltipEl.style.top = (e.clientY - rect.top + 14) + 'px';
    }
    app.querySelectorAll('.trend-hit').forEach(hit => {
      hit.addEventListener('mouseenter', (e) => {
        const idx = parseInt(hit.dataset.periodIdx, 10);
        const p = periods[idx];
        let html = '<div class="trend-tooltip-title">' + escapeHtml(String(p.label)) + '</div>';
        seriesData.forEach(sd => {
          html += '<div class="trend-tooltip-row"><span class="legend-dot" style="background:' + sd.color + '"></span>' + escapeHtml(sd.series.name) + ': <strong>' + fmtMoney(sd.values[idx]) + '</strong></div>';
        });
        tooltipEl.innerHTML = html;
        tooltipEl.style.display = 'block';
        positionTooltip(e);
      });
      hit.addEventListener('mousemove', positionTooltip);
      hit.addEventListener('mouseleave', () => { tooltipEl.style.display = 'none'; });
    });
  }

  function renderKeepingScroll(){
    const wrap = document.querySelector('.table-wrap');
    const scrollTop = wrap ? wrap.scrollTop : null;
    render();
    if(scrollTop !== null){
      const newWrap = document.querySelector('.table-wrap');
      if(newWrap) newWrap.scrollTop = scrollTop;
    }
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function readFile(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = reject;
      r.readAsText(file);
    });
  }

  async function onBudgetFile(e){
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await readFile(file);
      const rows = parseCSV(text);
      const {added, updated} = importBudget(rows);
      msg.budget = {ok:'ok', text: added + ' added, ' + updated + ' updated.'};
    } catch(err){
      msg.budget = {ok:'err', text: 'Could not read that file.'};
    }
    render(); persist();
  }

  async function onStatementFile(e){
    const file = e.target.files[0];
    if(!file) return;
    try{
      const text = await readFile(file);
      const rows = parseCSV(text);
      const {added, skipped} = importStatement(rows, file.name);
      msg.statement = {ok:'ok', text: added + ' transactions added' + (skipped ? ', ' + skipped + ' duplicates skipped.' : '.')};
    } catch(err){
      msg.statement = {ok:'err', text: 'Could not read that file.'};
    }
    render(); persist();
  }

  render();

  document.addEventListener('click', (e) => {
    if(!headerMenuOpen) return;
    const menu = document.querySelector('.header-menu');
    if(menu && !menu.contains(e.target)){
      headerMenuOpen = false;
      render();
    }
  });

  stateRef.on('value', snap => {
    const remote = snap.val();
    if(!remote) return;
    const json = JSON.stringify(remote);
    if(json === lastWritten) return;
    Object.keys(state).forEach(k => delete state[k]);
    Object.assign(state, remote);
    state.merchantMap = state.merchantMap || {};
    state.lastStatementUpload = state.lastStatementUpload || null;
    state.txFilters = state.txFilters || {search: '', account: 'all', category: 'all'};
    state.txFilters.parents = state.txFilters.parents || [];
    render();
    setSyncMode('synced');
  }, () => setSyncMode('local'));
}

function showLogin(errorMsg){
  document.getElementById('app').innerHTML =
    '<div class="login-overlay"><div class="login-card">' +
      '<div class="login-mark">BH</div>' +
      '<h1>Burke Household Ledger</h1>' +
      '<p class="sub">Sign in to view your shared budget</p>' +
      (errorMsg ? '<div class="msg err">' + errorMsg + '</div>' : '') +
      '<form id="login-form">' +
        '<label class="login-field">' +
          '<span>Email</span>' +
          '<input type="email" id="login-email" placeholder="you@example.com" required autocomplete="username">' +
        '</label>' +
        '<label class="login-field">' +
          '<span>Password</span>' +
          '<input type="password" id="login-password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" required autocomplete="current-password">' +
        '</label>' +
        '<button type="submit">Sign in</button>' +
      '</form>' +
    '</div></div>';
  document.getElementById('login-form').addEventListener('submit', function(e){
    e.preventDefault();
    const email = document.getElementById('login-email').value.trim();
    const password = document.getElementById('login-password').value;
    firebase.auth().signInWithEmailAndPassword(email, password).catch(function(err){
      showLogin('Could not sign in: ' + err.message);
    });
  });
}

firebase.auth().onAuthStateChanged(function(user){
  stateRef.off('value');
  if(user){
    stateRef.once('value').then(function(snap){
      const remote = snap.val();
      boot(remote || INITIAL_STATE);
    }).catch(function(){ boot(INITIAL_STATE); });
  } else {
    showLogin();
  }
});
</script>
</body>
</html>
